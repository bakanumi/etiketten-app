# Ablegen als /etc/nginx/sites-available/labels.aylins-makerspace.de (Symlink nach sites-enabled).
# Den HTTPS-Teil ergänzt danach: sudo certbot --nginx -d labels.aylins-makerspace.de
#
# Der Passwortschutz liegt in der App selbst (Umgebungsvariable ETIKETTEN_PASSWORD, nur Passwort,
# kein Benutzername) - hier ist deshalb kein auth_basic nötig.
server {
    listen 80;
    listen [::]:80;
    server_name labels.aylins-makerspace.de;

    # Große Etikettenlisten werden per POST für den PDF-Export gesendet.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Die App nutzt X-Real-IP (Fehlversuche beim Login zählen) und X-Forwarded-Proto (Secure-Cookie).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
