# Ablegen als /etc/nginx/sites-available/labels.aylins-makerspace.de (Symlink nach sites-enabled).
# Den HTTPS-Teil ergänzt danach: sudo certbot --nginx -d labels.aylins-makerspace.de
server {
    listen 80;
    listen [::]:80;
    server_name labels.aylins-makerspace.de;

    # Die App hat keinen eigenen Login -> Zugang per Passwort schützen.
    # Anlegen: sudo htpasswd -c /etc/nginx/.htpasswd-labels <benutzer>
    auth_basic "Etiketten";
    auth_basic_user_file /etc/nginx/.htpasswd-labels;

    # Große Etikettenlisten werden per POST für den PDF-Export gesendet.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
